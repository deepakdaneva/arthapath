version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
      ionic-capacitor:
        patterns: ["@ionic/*", "@capacitor/*", "ionicons"]
    ignore:
      # Angular supports one TypeScript minor at a time; TypeScript moves with
      # Angular upgrades (ng update). Patch releases still come through.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /firebase/rules-tests
    target-branch: development
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
