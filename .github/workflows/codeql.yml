name: codeql

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # JS/TS analysis has nothing to scan until the app lands in Phase 3.
      - name: Detect code
        id: code
        run: echo "skip=${{ matrix.language == 'javascript-typescript' && hashFiles('package.json') == '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.skip != 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - if: steps.code.outputs.skip != 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
