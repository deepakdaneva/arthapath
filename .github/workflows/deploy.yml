name: deploy

# development -> UAT (arthapath-uat), main -> production (arthapath-prod).
# Each GitHub environment only accepts deployments from its own branch and
# holds the non-secret variables FIREBASE_PROJECT_ID, WIF_PROVIDER,
# WIF_SERVICE_ACCOUNT. Authentication is keyless (Workload Identity Federation).

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'uat' }}
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # Fail fast with a clear error if the federated token exchange or
      # service-account impersonation is not working (firebase-tools only
      # reports a generic "Failed to authenticate"). The token is discarded,
      # never printed. Do not add debug logging to deploy steps: logs are public.
      - name: Verify Google credentials
        run: gcloud auth print-access-token --quiet > /dev/null && echo "Federated credentials OK"

      - name: Build app
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build -- --configuration ${{ github.ref_name == 'main' && 'production' || 'uat' }}

      - name: Deploy
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          targets=firestore
          if [ -d www ]; then targets="$targets,hosting"; fi
          npx --yes firebase-tools@15.35.0 deploy --only "$targets" --project "$PROJECT" --non-interactive
