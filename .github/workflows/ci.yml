name: ci

# PRs: validate + rules tests.
# Pushes to development/main: the same checks, then deploy only if they pass.
#   development -> UAT (arthapath-uat), main -> production (arthapath-prod).
# Each GitHub environment only accepts deployments from its own branch and holds
# non-secret variables: FIREBASE_PROJECT_ID, FIREBASE_API_KEY, FIREBASE_APP_ID,
# FIREBASE_MESSAGING_SENDER_ID, WIF_PROVIDER, WIF_SERVICE_ACCOUNT.
# Deploy authentication is keyless (Workload Identity Federation).
# After deploy, android-release packages the same bundle as a signed APK
# (repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD;
# key alias "arthapath", or the ANDROID_KEY_ALIAS variable): a UAT artifact from development, a GitHub release from main.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight deploy on a branch push; PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build number = commit count

      - name: Scan for committed secret patterns
        run: |
          # Defense in depth on top of GitHub push protection.
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}|gsk_[0-9A-Za-z]{40,}|sk-or-v1-[0-9a-f]{40,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|"private_key_id"' -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Possible secret committed"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/rules-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build number = commit count
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            firebase/rules-tests/package-lock.json
            package-lock.json
      - run: npm ci
      - run: npm test
      - name: App integration tests (emulators, real rules)
        working-directory: .
        run: |
          npm ci
          npm run config
          firebase/rules-tests/node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-arthapath "npx ng test --watch=false"

  e2e:
    # Web regression suite: Playwright against the dev server and the Firebase
    # emulators with the real security rules. Tests are browser-agnostic; CI
    # runs them on Playwright's Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build number = commit count
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/rules-tests/package-lock.json
      - run: npm ci
      - name: Firebase CLI (pinned in firebase/rules-tests)
        run: |
          npm ci --prefix firebase/rules-tests
          echo "$GITHUB_WORKSPACE/firebase/rules-tests/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  android:
    # PR check: the Android project builds and its unit tests and lint pass.
    # Branch pushes build signed APKs in android-release instead.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build number = commit count
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Unit tests, lint, debug APK (Gradle 9, AGP 9, JDK 25)
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

  deploy:
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'development')
    needs: [validate, rules, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'uat' }}
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build number = commit count

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Build app
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          npm ci
          npm run build -- --configuration ${{ github.ref_name == 'main' && 'production' || 'uat' }}

      # The exact bundle deployed here is also packaged into the Android APK.
      - name: Keep web bundle for the Android build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-bundle
          path: www/
          retention-days: 1

      # Install everything before credentials exist, so no package install
      # script can read them.
      - name: Install Firebase CLI
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/fbt" firebase-tools@15.35.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # Fail fast with a clear error if the federated token exchange or
      # service-account impersonation is not working (firebase-tools only
      # reports a generic "Failed to authenticate"). The token is discarded,
      # never printed. Do not add debug logging to deploy steps: logs are public.
      - name: Verify Google credentials
        run: gcloud auth print-access-token --quiet > /dev/null && echo "Federated credentials OK"

      - name: Deploy
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: '"$RUNNER_TEMP/fbt/node_modules/.bin/firebase" deploy --only firestore,hosting --project "$PROJECT" --non-interactive'

  android-release:
    # After a successful deploy: package the deployed bundle as an Android APK.
    # development -> UAT APK (io.github.deepakdaneva.arthapath.uat) as a run artifact.
    # main -> production APK attached to a GitHub release vX.Y.Z.
    # The APK is built unsigned and signed afterwards with apksigner, so the
    # signing key is only present in the signing step (repository secrets
    # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD; alias "arthapath").
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release (main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-bundle
          path: www
      - run: npx cap sync android

      - name: Version from the deployed bundle
        id: v
        run: |
          VERSION=$(node -p "require('./www/version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION##*.}" >> "$GITHUB_OUTPUT"

      - name: Unit tests, lint, release APK (unsigned)
        working-directory: android
        env:
          UAT: ${{ github.ref_name != 'main' }}
        run: |
          EXTRA=()
          if [ "$UAT" = "true" ]; then EXTRA=(-PappIdSuffix=.uat "-PappName=ArthaPath UAT"); fi
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon             -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.version }} "${EXTRA[@]}"

      - name: Sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Not secret; a variable so its value ("arthapath") is not masked in logs.
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'arthapath' }}
          NAME: ${{ github.ref_name == 'main' && 'ArthaPath' || 'ArthaPath-UAT' }}
          PACKAGE: io.github.deepakdaneva.arthapath${{ github.ref_name == 'main' && '' || '.uat' }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets missing (see docs/deployment/ANDROID_RELEASE.md)"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          OUT="$NAME-$VERSION.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS"             --out "$OUT" android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$KS"
          "$BT/apksigner" verify --print-certs "$OUT" # fails on a bad signature; prints the public certificate
          BADGING=$("$BT/aapt2" dump badging "$OUT" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='$PACKAGE' versionCode='${VERSION##*.}' versionName='$VERSION'"             || { echo "::error::APK package or version mismatch"; exit 1; }
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Upload UAT APK
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-uat-apk
          path: ArthaPath-UAT-*
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" "$APK" "$APK.sha256"             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "ArthaPath $VERSION" --generate-notes
